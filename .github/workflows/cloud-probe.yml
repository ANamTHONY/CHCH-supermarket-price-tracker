name: Cloud collection probe

on:
  push:
    branches: [codex/cloud-collection]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-collection-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      TZ: Pacific/Auckland
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install collection dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth
      - name: Run regression tests
        run: python -m unittest discover -s tests
      - name: Probe verified stores without production writes
        run: |
          xvfb-run -a python -u run_pipelines.py --source woolworths --stores 001 --test --limit 5 --workers 1 --retries 0
          xvfb-run -a python -u run_pipelines.py --source newworld --stores b3158cd8-72b9-40e5-8c4e-abd43c1be305 --test --limit 5 --workers 1 --retries 0
          xvfb-run -a python -u run_pipelines.py --source paknsave --stores be4c4780-218e-425a-a90f-63e21773572b --test --limit 5 --workers 1 --retries 0
