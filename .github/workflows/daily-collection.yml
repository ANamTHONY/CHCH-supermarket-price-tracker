name: Daily supermarket collection

on:
  schedule:
    - cron: '15 9 * * *'
      timezone: Pacific/Auckland
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supermarket-production-collection
  cancel-in-progress: false

jobs:
  collect:
    # Enable only after the independent cloud probe and full run pass.
    if: github.event_name == 'workflow_dispatch' || vars.CLOUD_COLLECTION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      TZ: Pacific/Auckland
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install collection dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth
      - name: Validate cloud configuration
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_VOLUME_PATH: ${{ vars.DATABRICKS_VOLUME_PATH }}
          DATABRICKS_INGESTION_JOB_ID: ${{ vars.DATABRICKS_INGESTION_JOB_ID }}
        run: python tools/cloud_preflight.py
      - name: Collect all 28 stores and confirm cloud ingestion
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_VOLUME_PATH: ${{ vars.DATABRICKS_VOLUME_PATH }}
          DATABRICKS_INGESTION_JOB_ID: ${{ vars.DATABRICKS_INGESTION_JOB_ID }}
        run: xvfb-run -a python -u run_pipelines.py
      - name: Record daily result
        if: always()
        run: python tools/cloud_run_summary.py
      - name: Preserve collection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collection-${{ github.run_id }}
          path: |
            data/production_*/manifest.json
            data/production_*/**/error.txt
            data/production_*/**/page.txt
            data/production_*/**/page.png
            data/production_*/**/details.jsonl
            data/prices_*.csv
          if-no-files-found: ignore
          retention-days: 7
